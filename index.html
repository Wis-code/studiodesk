<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1d2a" />
  <meta name="description" content="StudioDesk — creative operations for Wiscode Studio" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <script>
    (()=>{try{const saved=localStorage.getItem('studiodeskTheme');const theme=saved||((window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark');document.documentElement.dataset.theme=theme;}catch{document.documentElement.dataset.theme='dark';}})();
  </script>
  <link rel="icon" type="image/png" href="./assets/studiodesk-mark.png" />
  <link rel="stylesheet" href="./styles.css" />
  <title>StudioDesk</title>
</head>
<body>
  <div id="app"></div>
  <script src="./config/firebase-config.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
